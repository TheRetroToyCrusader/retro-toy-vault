<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Retro Toy Vault</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      color: #111111;
    }

    .add-toy-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    input,
    select,
    button {
      box-sizing: border-box;
      min-height: 46px;
      padding: 10px 14px;
      font-size: 16px;
    }

    #toyName {
      width: 250px;
    }

    #toyLine {
      width: 250px;
    }

    button {
      cursor: pointer;
    }

    .add-button {
      background: #6a00ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .add-button:hover {
      background: #5200c7;
    }

    #toyList {
      list-style: none;
      padding: 0;
    }

    .toy-item {
      display: inline-block;
      width: 210px;
      margin: 0 16px 25px 0;
      padding: 15px;
      vertical-align: top;
      background: #fafafa;
      border: 1px solid #dddddd;
      border-radius: 12px;
    }

    .toy-name {
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .toy-line {
      display: block;
      color: #6a00ff;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .toy-photo {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }

    .delete-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      background: #d93025;
      color: white;
      border: none;
      border-radius: 7px;
    }

    .delete-button:hover {
      background: #b3261e;
    }

    .empty-message {
      color: #666666;
    }

    @media (max-width: 650px) {
      body {
        padding: 15px;
      }

      .add-toy-area {
        display: block;
      }

      #toyName,
      #toyLine,
      #toyPhoto,
      .add-button {
        display: block;
        width: 100%;
        margin-bottom: 12px;
      }

      .toy-item {
        display: block;
        width: auto;
        margin-right: 0;
      }

      .toy-photo {
        height: auto;
        max-height: 350px;
        object-fit: contain;
        background: white;
      }
    }
  </style>
</head>

<body>

  <h1>🧸 Retro Toy Vault</h1>

  <div class="add-toy-area">

    <input
      id="toyName"
      type="text"
      placeholder="Enter toy name"
    >

    <select id="toyLine">
      <option value="">
        Choose toy line
      </option>

      <option value="Masters of the Universe">
        Masters of the Universe
      </option>

      <option value="Teenage Mutant Ninja Turtles">
        Teenage Mutant Ninja Turtles
      </option>

      <option value="Star Wars">
        Star Wars
      </option>

      <option value="ThunderCats">
        ThunderCats
      </option>

      <option value="Transformers">
        Transformers
      </option>

      <option value="The Real Ghostbusters">
        The Real Ghostbusters
      </option>

      <option value="Action Force">
        Action Force
      </option>

      <option value="Power Rangers">
        Power Rangers
      </option>

      <option value="Other">
        Other
      </option>
    </select>
<input
  id="toyValue"
  type="number"
  placeholder="Value (£)"
>
    <input
      id="toyPhoto"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <button
      class="add-button"
      type="button"
      onclick="addToy()"
    >
      Add Toy
    </button>

  </div>

  <div class="card">
  <h2>Collection Summary</h2>
    <p id="totalValue">
  Collection Value: £0
</p>

  <p id="totalToys">Total Toys: 0</p>

  <p id="motuCount">
    Masters of the Universe: 0
  </p>
</div>

<div class="card">
  <h2>My Toys</h2>

    <ul id="toyList"></ul>
  </div>

  <div class="card">
    <h2>Still Needed</h2>

    <ul>
      <li>❌ Man-At-Arms</li>
      <li>❌ Beast Man</li>
      <li>❌ Teela</li>
    </ul>
  </div>

  <script>
    let toys = [];

    try {
      const savedToys =
        JSON.parse(
          localStorage.getItem("retroToyVault")
        );

      toys =
        Array.isArray(savedToys)
          ? savedToys
          : [];

    } catch (error) {
      toys = [];
    }

    function saveToys() {
      try {
        localStorage.setItem(
          "retroToyVault",
          JSON.stringify(toys)
        );

        return true;

      } catch (error) {
        alert(
          "The toy could not be saved because browser storage is full. " +
          "Try deleting an existing toy or using a smaller photograph."
        );

        return false;
      }
    }

    function renderToys() {
      const list =
        document.getElementById("toyList");
      document.getElementById(
  "totalToys"
).textContent =
  "Total Toys: " + toys.length;
      const totalValue =
  toys.reduce(
    (sum, toy) =>
      sum + Number(toy.value || 0),
    0
  );

document.getElementById(
  "totalValue"
).textContent =
  "Collection Value: £" +
  totalValue;

const motuCount =
  toys.filter(
    toy =>
      toy.line ===
      "Masters of the Universe"
  ).length;

document.getElementById(
  "motuCount"
).textContent =
  "Masters of the Universe: " +
  motuCount;

      list.innerHTML = "";

      if (toys.length === 0) {
        const emptyMessage =
          document.createElement("li");

        emptyMessage.className =
          "empty-message";

        emptyMessage.textContent =
          "No toys added yet.";

        list.appendChild(emptyMessage);

        return;
      }

      toys.forEach((toy, index) => {
        const li =
          document.createElement("li");

        li.className =
          "toy-item";

        const toyName =
          document.createElement("strong");

        toyName.className =
          "toy-name";

        toyName.textContent =
          "✅ " + toy.name;

        li.appendChild(toyName);

        const toyLine =
          document.createElement("span");

        toyLine.className =
          "toy-line";

        toyLine.textContent =
          toy.line || "Uncategorised";

        li.appendChild(toyLine);
        const toyValue =
  document.createElement("div");

toyValue.textContent =
  "£" + (toy.value || 0);

toyValue.style.fontWeight =
  "bold";

toyValue.style.marginBottom =
  "10px";

li.appendChild(toyValue);

        if (toy.photo) {
          const image =
            document.createElement("img");

          image.src =
            toy.photo;

          image.alt =
            "Photo of " + toy.name;

          image.className =
            "toy-photo";

          li.appendChild(image);
        }

        const deleteButton =
          document.createElement("button");

        deleteButton.type =
          "button";

        deleteButton.className =
          "delete-button";

        deleteButton.textContent =
          "Delete";

        deleteButton.onclick =
          function () {
            deleteToy(index);
          };

        li.appendChild(deleteButton);
        list.appendChild(li);
      });
    }

    function compressPhoto(file) {
      return new Promise(
        (resolve, reject) => {
          const reader =
            new FileReader();

          reader.onload =
            function (event) {
              const image =
                new Image();

              image.onload =
                function () {
                  const maximumSize =
                    800;

                  let newWidth =
                    image.width;

                  let newHeight =
                    image.height;

                  if (
                    newWidth > maximumSize ||
                    newHeight > maximumSize
                  ) {
                    const scale =
                      Math.min(
                        maximumSize / newWidth,
                        maximumSize / newHeight
                      );

                    newWidth =
                      Math.round(
                        newWidth * scale
                      );

                    newHeight =
                      Math.round(
                        newHeight * scale
                      );
                  }

                  const canvas =
                    document.createElement(
                      "canvas"
                    );

                  canvas.width =
                    newWidth;

                  canvas.height =
                    newHeight;

                  const context =
                    canvas.getContext("2d");

                  context.drawImage(
                    image,
                    0,
                    0,
                    newWidth,
                    newHeight
                  );

                  const compressedPhoto =
                    canvas.toDataURL(
                      "image/jpeg",
                      0.65
                    );

                  resolve(
                    compressedPhoto
                  );
                };

              image.onerror =
                function () {
                  reject(
                    new Error(
                      "The photograph could not be opened."
                    )
                  );
                };

              image.src =
                event.target.result;
            };

          reader.onerror =
            function () {
              reject(
                new Error(
                  "The photograph could not be read."
                )
              );
            };

          reader.readAsDataURL(file);
        }
      );
    }

    async function addToy() {
      const nameInput =
        document.getElementById(
          "toyName"
        );

      const lineInput =
        document.getElementById(
          "toyLine"
        );

      const photoInput =
        document.getElementById(
          "toyPhoto"
        );

      const name =
        nameInput.value.trim();

      const toyLine =
        lineInput.value;
      const value =
  document.getElementById(
    "toyValue"
  ).value;

      const file =
        photoInput.files[0];

      if (!name) {
        alert(
          "Please enter a toy name."
        );

        return;
      }

      if (!toyLine) {
        alert(
          "Please choose a toy line."
        );

        return;
      }

      if (!file) {
        alert(
          "Please choose or take a photograph."
        );

        return;
      }

      if (
        !file.type.startsWith("image/")
      ) {
        alert(
          "Please choose an image file."
        );

        return;
      }

      try {
        const compressedPhoto =
          await compressPhoto(file);

        toys.push({
  name: name,
  line: toyLine,
  value: value,
  photo: compressedPhoto
});

        const saved =
          saveToys();

        if (!saved) {
          toys.pop();
          return;
        }

        renderToys();

        nameInput.value = "";
        lineInput.value = "";
        photoInput.value = "";

      } catch (error) {
        alert(error.message);
      }
    }

    function deleteToy(index) {
      const toy =
        toys[index];

      if (!toy) {
        return;
      }

      const confirmed =
        confirm(
          "Are you sure you want to delete " +
          toy.name +
          "?"
        );

      if (!confirmed) {
        return;
      }

      const deletedToy =
        toys.splice(index, 1)[0];

      const saved =
        saveToys();

      if (!saved) {
        toys.splice(
          index,
          0,
          deletedToy
        );

        return;
      }

      renderToys();
    }

    renderToys();
  </script>

</body>
</html>
