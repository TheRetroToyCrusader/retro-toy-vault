<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Toy Vault</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .card{
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,.1);
    }

    input{
      padding:10px;
      width:250px;
    }

    button{
      padding:10px 15px;
      margin-left:10px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h1>🧸 Retro Toy Vault</h1>

<input id="toyName" placeholder="Enter toy name">

<input
  type="file"
  id="toyPhoto"
  accept="image/*"
>

<button onclick="addToy()">
  Add Toy
</button>

<div class="card">
  <h2>My Toys</h2>
  <ul id="toyList">
    <li>✅ He-Man</li>
    <li>✅ Skeletor</li>
  </ul>
</div>

<div class="card">
  <h2>Still Needed</h2>
  <ul>
    <li>❌ Man-At-Arms</li>
    <li>❌ Beast Man</li>
    <li>❌ Teela</li>
    <li>❌ Battle Cat</li>
  </ul>
</div>

<script>

let toys =
  JSON.parse(localStorage.getItem("retroToyVault"))
  || [];

function saveToys() {
  localStorage.setItem(
    "retroToyVault",
    JSON.stringify(toys)
  );
}

function renderToys() {

  const list =
    document.getElementById("toyList");

  list.innerHTML = "";

  toys.forEach((toy, index) => {

    const li =
      document.createElement("li");

    li.style.marginBottom = "25px";

    const name =
      document.createElement("strong");

    name.textContent = "✅ " + toy.name;

    li.appendChild(name);

    if (toy.photo) {

      const image =
        document.createElement("img");

      image.src = toy.photo;
      image.alt = "Photo of " + toy.name;
      image.width = 150;

      image.style.display = "block";
      image.style.marginTop = "10px";
      image.style.borderRadius = "10px";

      li.appendChild(image);
    }

    const deleteButton =
      document.createElement("button");

    deleteButton.textContent = "Delete";
    deleteButton.type = "button";

    deleteButton.style.display = "block";
    deleteButton.style.marginTop = "12px";
    deleteButton.style.marginLeft = "0";
    deleteButton.style.background = "#d93025";
    deleteButton.style.color = "white";
    deleteButton.style.border = "none";
    deleteButton.style.borderRadius = "6px";

    deleteButton.onclick = function() {
      deleteToy(index);
    };

    li.appendChild(deleteButton);
    list.appendChild(li);

  });

}

function addToy() {

  const nameInput =
    document.getElementById("toyName");

  const photoInput =
    document.getElementById("toyPhoto");

  const name =
    nameInput.value.trim();

  const file =
    photoInput.files[0];

  if (!name) {
    alert("Please enter a toy name.");
    return;
  }

  if (!file) {
    alert("Please choose a photograph.");
    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e) {

    toys.push({
      name: name,
      photo: e.target.result
    });

    saveToys();
    renderToys();

    nameInput.value = "";
    photoInput.value = "";

  };

  reader.readAsDataURL(file);

}

function deleteToy(index) {

  const toyName =
    toys[index].name;

  const confirmed =
    confirm(
      "Are you sure you want to delete "
      + toyName
      + "?"
    );

  if (!confirmed) {
    return;
  }

  toys.splice(index, 1);

  saveToys();
  renderToys();

}

renderToys();

</script>
</body>
</html>
