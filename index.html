<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Toy Vault</title>

  <style>
    <body>

<h1>🧸 Retro Toy Vault</h1>

<input id="toyName" placeholder="Enter toy name">

<button onclick="addToy()">
Add Toy
</button>

<ul id="toyList">
</ul>

<script>
function addToy() {

  const toyName =
    document.getElementById("toyName").value;

  if(toyName === "") return;

  const li =
    document.createElement("li");

  li.textContent = toyName;

  document
    .getElementById("toyList")
    .appendChild(li);

  document
    .getElementById("toyName")
    .value = "";
}
</script>

</body>

<h1>🧸 Retro Toy Vault</h1>

<div class="card">
  <h2>Collection Progress</h2>
  <p>2 of 6 figures owned (33%)</p>
</div>

<div class="card">
  <h2>Owned</h2>
  <ul>
    <li>✅ He-Man</li>
    <li>✅ Skeletor</li>
  </ul>
</div>

<div class="card">
  <h2>Still Needed</h2>
  <ul>
    <li>❌ Man-At-Arms</li>
    <li>❌ Beast Man</li>
    <li>❌ Teela</li>
    <li>❌ Battle Cat</li>
  </ul>
</div>

</body>
</html>
