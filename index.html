<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Toy Vault</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .card{
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,.1);
    }

    input{
      padding:10px;
      width:250px;
    }

    button{
      padding:10px 15px;
      margin-left:10px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h1>🧸 Retro Toy Vault</h1>

<input id="toyName" placeholder="Enter toy name">

<input
  type="file"
  id="toyPhoto"
  accept="image/*"
>

<button onclick="addToy()">
  Add Toy
</button>

<div class="card">
  <h2>My Toys</h2>
  <ul id="toyList">
    <li>✅ He-Man</li>
    <li>✅ Skeletor</li>
  </ul>
</div>

<div class="card">
  <h2>Still Needed</h2>
  <ul>
    <li>❌ Man-At-Arms</li>
    <li>❌ Beast Man</li>
    <li>❌ Teela</li>
    <li>❌ Battle Cat</li>
  </ul>
</div>

<script>

let toys =
  JSON.parse(localStorage.getItem("retroToyVault"))
  || [];

function renderToys() {

  const list =
    document.getElementById("toyList");

  list.innerHTML = "";

  toys.forEach(toy => {

    const li =
      document.createElement("li");

    li.style.marginBottom = "20px";

    li.innerHTML = `
      <strong>✅ ${toy.name}</strong><br>
      <img
        src="${toy.photo}"
        width="150"
        style="border-radius:10px;margin-top:10px;"
      >
    `;

    list.appendChild(li);

  });

}

function addToy() {

  const name =
    document.getElementById("toyName").value.trim();

  const photoInput =
    document.getElementById("toyPhoto");

  const file =
    photoInput.files[0];

  if (!name || !file) return;

  const reader =
    new FileReader();

  reader.onload = function(e) {

    toys.push({
      name: name,
      photo: e.target.result
    });

    localStorage.setItem(
      "retroToyVault",
      JSON.stringify(toys)
    );

    renderToys();

    document.getElementById("toyName").value = "";
    document.getElementById("toyPhoto").value = "";

  };

  reader.readAsDataURL(file);

}

renderToys();

</script>
</body>
</html>
