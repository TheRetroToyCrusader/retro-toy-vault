<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Toy Vault</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .card{
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,.1);
    }

    input{
      padding:10px;
      width:250px;
    }

    button{
      padding:10px 15px;
      margin-left:10px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h1>🧸 Retro Toy Vault</h1>

<input id="toyName" placeholder="Enter toy name">

<input
  type="file"
  id="toyPhoto"
  accept="image/*"
>

<button onclick="addToy()">
  Add Toy
</button>

<div class="card">
  <h2>My Toys</h2>
  <ul id="toyList">
    <li>✅ He-Man</li>
    <li>✅ Skeletor</li>
  </ul>
</div>

<div class="card">
  <h2>Still Needed</h2>
  <ul>
    <li>❌ Man-At-Arms</li>
    <li>❌ Beast Man</li>
    <li>❌ Teela</li>
    <li>❌ Battle Cat</li>
  </ul>
</div>

<script>

let toys = [];

try {
  const savedToys =
    JSON.parse(localStorage.getItem("retroToyVault"));

  toys = Array.isArray(savedToys)
    ? savedToys
    : [];
} catch (error) {
  toys = [];
}

function saveToys() {
  try {
    localStorage.setItem(
      "retroToyVault",
      JSON.stringify(toys)
    );

    return true;
  } catch (error) {
    alert(
      "The photograph could not be saved because browser storage is full. " +
      "Try deleting an existing toy or selecting a smaller photograph."
    );

    return false;
  }
}

function renderToys() {
  const list =
    document.getElementById("toyList");

  list.innerHTML = "";

  if (toys.length === 0) {
    const emptyMessage =
      document.createElement("li");

    emptyMessage.textContent =
      "No toys added yet.";

    list.appendChild(emptyMessage);

    return;
  }

  toys.forEach((toy, index) => {
    const li =
      document.createElement("li");

    li.style.marginBottom = "25px";
    li.style.listStyle = "none";

    const name =
      document.createElement("strong");

    name.textContent =
      "✅ " + toy.name;

    li.appendChild(name);

    if (toy.photo) {
      const image =
        document.createElement("img");

      image.src = toy.photo;
      image.alt =
        "Photo of " + toy.name;

      image.style.display = "block";
      image.style.width = "150px";
      image.style.maxWidth = "100%";
      image.style.height = "auto";
      image.style.marginTop = "10px";
      image.style.borderRadius = "10px";

      li.appendChild(image);
    }

    const deleteButton =
      document.createElement("button");

    deleteButton.type = "button";
    deleteButton.textContent = "Delete";

    deleteButton.style.display = "block";
    deleteButton.style.marginTop = "12px";
    deleteButton.style.marginLeft = "0";
    deleteButton.style.padding = "10px 15px";
    deleteButton.style.background = "#d93025";
    deleteButton.style.color = "white";

</body>
</html>
