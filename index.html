<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Toy Vault</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      max-width:900px;
      margin:auto;
      padding:20px;
      background:#f5f5f5;
    }

    .card{
      background:white;
      padding:15px;
      margin-bottom:15px;
      border-radius:10px;
      box-shadow:0 2px 5px rgba(0,0,0,.1);
    }

    h1{
      color:#6a00ff;
    }
  </style>
</head>
<body>

<h1>🧸 Retro Toy Vault</h1>

<div class="card">
  <h2>Collection Progress</h2>
  <p>2 of 6 figures owned (33%)</p>
</div>

<div class="card">
  <h2>Owned</h2>
  <ul>
    <li>✅ He-Man</li>
    <li>✅ Skeletor</li>
  </ul>
</div>

<div class="card">
  <h2>Still Needed</h2>
  <ul>
    <li>❌ Man-At-Arms</li>
    <li>❌ Beast Man</li>
    <li>❌ Teela</li>
    <li>❌ Battle Cat</li>
  </ul>
</div>

</body>
</html>
