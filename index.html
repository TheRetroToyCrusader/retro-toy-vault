<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Toy Vault</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .card{
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,.1);
    }

    input{
      padding:10px;
      width:250px;
    }

    button{
      padding:10px 15px;
      margin-left:10px;
      cursor:pointer;
    }
  </style>
</head>

<body>

<h1>🧸 Retro Toy Vault</h1>

<input id="toyName" placeholder="Enter toy name">
<button onclick="addToy()">Add Toy</button>

<div class="card">
  <h2>My Toys</h2>
  <ul id="toyList">
    <li>✅ He-Man</li>
    <li>✅ Skeletor</li>
  </ul>
</div>

<div class="card">
  <h2>Still Needed</h2>
  <ul>
    <li>❌ Man-At-Arms</li>
    <li>❌ Beast Man</li>
    <li>❌ Teela</li>
    <li>❌ Battle Cat</li>
  </ul>
</div>

<script>

let toys =
  JSON.parse(localStorage.getItem("retroToyVault"))
  || ["He-Man", "Skeletor"];

function renderToys() {

  const list =
    document.getElementById("toyList");

  list.innerHTML = "";

  toys.forEach(toy => {

    const li =
      document.createElement("li");

    li.textContent = "✅ " + toy;

    list.appendChild(li);

  });

}

function addToy() {

  const input =
    document.getElementById("toyName");

  const toyName =
    input.value.trim();

  if (!toyName) return;

  toys.push(toyName);

  localStorage.setItem(
    "retroToyVault",
    JSON.stringify(toys)
  );

  renderToys();

  input.value = "";

}

renderToys();

</script>
</body>
</html>
