<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Retro Toy Vault</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      color: #111111;
    }

    .add-toy-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    input,
    select,
    button {
      box-sizing: border-box;
      min-height: 46px;
      padding: 10px 14px;
      font-size: 16px;
    }

    #toyName {
      width: 250px;
    }

    #toyLine {
      width: 250px;
    }

    button {
      cursor: pointer;
    }

    .add-button {
      background: #6a00ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .add-button:hover {
      background: #5200c7;
    }

    #toyList {
      list-style: none;
      padding: 0;
    }

    .toy-item {
      display: inline-block;
      width: 210px;
      margin: 0 16px 25px 0;
      padding: 15px;
      vertical-align: top;
      background: #fafafa;
      border: 1px solid #dddddd;
      border-radius: 12px;
    }

    .toy-name {
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .toy-line {
      display: block;
      color: #6a00ff;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .toy-photo {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }

    .delete-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      background: #d93025;
      color: white;
      border: none;
      border-radius: 7px;
    }

    .delete-button:hover {
      background: #b3261e;
    }

    .empty-message {
      color: #666666;
    }

    @media (max-width: 650px) {
      body {
        padding: 15px;
      }

      .add-toy-area {
        display: block;
      }

      #toyName,
      #toyLine,
      #toyPhoto,
      .add-button {
        display: block;
        width: 100%;
        margin-bottom: 12px;
      }
